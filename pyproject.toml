[project]
name = "thinknxg_admin"
authors = [{ name = "Kreatao", email = "sales@kreatao.com" }]
description = "thinkNXG Admin - Premium Admin Command Center for thinkNXG Core, ERP and HR (V16)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"

[project.urls]
Homepage = "https://thinknxg.com"
Documentation = "https://docs.thinknxg.com/thinknxgerp"
Repository = "https://github.com/thinknxg/thinkNXG-Admin"
