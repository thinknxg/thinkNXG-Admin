<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>thinkNXG Command Center</title>
		<link rel="icon" type="image/png" href="/assets/frappe/images/thinkNXG-favicon.png" />
		<script>
			// Apply the saved theme before first paint to avoid a flash.
			(function () {
				try {
					var t = localStorage.getItem("nxg:theme") || "system";
					var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
				} catch (e) {}
			})();
		</script>
		<script type="module" crossorigin src="/assets/thinknxg_admin/frontend/assets/index-BTv-IpYf.js"></script>
		<link rel="stylesheet" crossorigin href="/assets/thinknxg_admin/frontend/assets/index-CXebDdlx.css">
	</head>
	<body>
		<div id="app"></div>
		<script>
			window.csrf_token = "{{ csrf_token }}";
		</script>
		<script>
			window.thinknxg_boot = {{ boot_json }};
		</script>
	</body>
</html>
