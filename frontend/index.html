<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>thinkNXG Command Center</title>
		<link rel="icon" href="/assets/thinknxg_admin/images/brand/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/assets/thinknxg_admin/images/brand/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/assets/thinknxg_admin/images/brand/favicon-16.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/assets/thinknxg_admin/images/brand/icon-192.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/assets/thinknxg_admin/images/brand/apple-touch-icon.png" />
		<script>
			// Apply the saved theme before first paint to avoid a flash.
			(function () {
				try {
					var t = localStorage.getItem("nxg:theme") || "system";
					var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script>
			window.csrf_token = "{{ csrf_token }}";
		</script>
		<script>
			window.thinknxg_boot = {{ boot_json }};
		</script>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
